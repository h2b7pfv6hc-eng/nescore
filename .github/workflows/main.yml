name: Build for Wii

on:
  push:
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boot.dol
        run: make -C wii dist
      - uses: actions/upload-artifact@v4
        with:
          name: nescore-wii
          path: wii/dist/
